name: Publish

# Releasing pope is "publish a GitHub Release" - everything else happens
# here. Publishing a release for tag v1.2.0 (creating the tag too, if it
# didn't already exist) builds that exact commit, publishes it under
# version 1.2.0 (see build.gradle.kts's popeVersion property), and
# commits the result onto the maven-repo branch, which GitHub Pages
# serves as the actual Maven repository consumers resolve the plugin
# from (ADR-0008). Deliberately not triggered on a plain tag push - a
# release, not a bare tag, is the visible, user-facing "here's what's
# new" record pope-init/pope-init.bat point people at.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Publish to a local folder
        run: |
          ./gradlew publish \
            -PpopeVersion=${{ steps.version.outputs.value }} \
            -PpopePublishRepoUrl=file://${{ github.workspace }}/build/publish-repo

      - name: Check out maven-repo branch
        uses: actions/checkout@v4
        with:
          ref: maven-repo
          path: maven-repo

      - name: Copy published files onto maven-repo
        run: cp -r build/publish-repo/. maven-repo/

      - name: Commit and push
        working-directory: maven-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Nothing new to publish" && exit 0
          git commit -m "Publish pope ${{ steps.version.outputs.value }}"
          git push origin maven-repo
